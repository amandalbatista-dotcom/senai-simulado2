<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <title>Cadastro de Produtos</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

   <h2>Cadastro de Produtos</h2>
   <div id="relogio">Carregando data e horário...</div>
   <br>

   <!-- Adicionado IDs para identificar os campos -->
   <label>Nome do Cliente:</label><br>
   <input type="text" id="nomeCliente"><br><br>

   <label>Produto:</label><br>
   <input type="text" id="nomeProduto"><br><br>

   <label>Preço:</label><br>
   <input type="number" id="precoProduto" step="0.01"><br><br>

   <!-- Adicionado ID no botão -->
   <button id="btnSalvar">Salvar</button>

   <hr>

   <h3>Produtos Cadastrados</h3>
   <!-- Tabela para mostrar as informações recebidas -->
   <table border="1" id="tabelaProdutos" style="width: 100%; text-align: left; border-collapse: collapse;">
       <thead>
           <tr>
               <th>Cliente</th>
               <th>Produto</th>
               <th>Preço</th>
           </tr>
       </thead>
       <tbody id="corpoTabela">
           <!-- Os produtos cadastrados vão aparecer aqui dentro -->
       </tbody>
   </table>

   <script src="script.js"></script>
</body>
</html>
